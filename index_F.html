
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para el amor de mi vida</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts-bg"></div>

  <div class="card">
    <div class="message">
      <h1>Para el amor de mi vida ❤️</h1>

      <p>
        Falta muy poco para tu cumpleaños y no puedo esperar para celebrarlo contigo,
        llenarte de abrazos, besos y muchas sorpresas.
      </p>

      <p>
        Gracias por existir y por hacerme tan feliz cada día.
      </p>

      <div class="countdown">
        <h2>Esperando tu cumpleaños en...</h2>
        <div id="timer">Cargando...</div>
      </div>

      <p class="signature">Con todo mi amor, Migu ❤️</p>
    </div>

    <div class="tree-container">
      <div class="tree">
        <div class="trunk"></div>
        <div id="heartTree"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
